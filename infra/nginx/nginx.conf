worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;                      # masque la version de nginx
    access_log    /dev/stdout;

    # --- Anti-slowloris : on coupe les clients trop lents ---
    client_header_timeout 10s;
    client_body_timeout   10s;
    send_timeout          10s;
    keepalive_timeout     15s;
    client_max_body_size  1m;
    large_client_header_buffers 4 8k;

    # --- Anti-flood : limites par adresse IP ---
    limit_req_zone  $binary_remote_addr zone=req_api:10m rate=10r/s;
    limit_req_zone  $binary_remote_addr zone=req_web:10m rate=30r/s;
    limit_conn_zone $binary_remote_addr zone=conn_ip:10m;
    limit_req_status  429;
    limit_conn_status 429;

    # DNS Docker : "api" est résolu à la requête, nginx démarre même si l'API est arrêtée
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 443 ssl;
        http2 on;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:1m;

        # Login devant tout le site (dashboard + API)
        auth_basic           "Sentinel-X";
        auth_basic_user_file /tmp/htpasswd;     # généré au démarrage par gen-htpasswd.sh

        limit_conn conn_ip 20;              # 20 connexions simultanées max par IP

        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options        DENY    always;
        add_header Referrer-Policy        no-referrer always;

        set $api http://api:8080;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;

        # Endpoints internes de Spring : jamais exposés
        location ^~ /actuator {
            return 404;
        }

        # API REST
        location /api/ {
            limit_req zone=req_api burst=20 nodelay;
            proxy_pass $api;
        }

        # WebSocket temps réel vers le dashboard
        location /ws {
            limit_req zone=req_api burst=5 nodelay;
            proxy_http_version 1.1;
            proxy_set_header Upgrade           $http_upgrade;
            proxy_set_header Connection        $connection_upgrade;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 1h;
            proxy_pass $api;
        }

        # Dashboard (fichiers statiques servis par Spring)
        location / {
            limit_req zone=req_web burst=60 nodelay;
            proxy_pass $api;
        }
    }
}
