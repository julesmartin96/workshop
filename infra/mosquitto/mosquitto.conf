# Interne au réseau Docker (API) : jamais publié dans le compose
listener 1883

# Exposé pour l'ESP8266 : MQTT chiffré
listener 8883
cafile   /mosquitto/certs/ca.crt
certfile /mosquitto/certs/server.crt
keyfile  /mosquitto/certs/server.key
tls_version tlsv1.2

# Authentification et droits, communs aux deux listeners
allow_anonymous false
# Comptes générés au démarrage par gen-passwd.sh (fichier en mémoire)
password_file /tmp/passwd
acl_file      /mosquitto/config/acl

# Limites anti-flood
max_connections 20
max_packet_size 4096

persistence true
persistence_location /mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
